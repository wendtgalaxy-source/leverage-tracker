<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Leverage Tracker</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2535/2535071.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2535/2535071.png">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
      --accent: #3b82f6; --accent-hover: #2563eb; --accent-indigo: #6366f1;
      --success: #10b981; --success-bg: rgba(16, 185, 129, 0.1);
      --danger: #ef4444; --danger-bg: rgba(239, 68, 68, 0.1);
      --border: #334155; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { margin-bottom: 30px; text-align: center; }
    h1 { font-size: 28px; font-weight: 700; background: linear-gradient(to right, var(--accent), var(--accent-indigo)); -webkit-background-clip: text; color: transparent; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
    .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: var(--radius); transition: all 0.2s; white-space: nowrap; }
    .tab-btn.active { color: var(--text-main); background: var(--bg-card); box-shadow: 0 0 0 1px var(--border); }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 15px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
    input, select { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 15px; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }
    .kpi-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: center; }
    .kval { font-size: 22px; font-weight: 800; display: block; }
    .pos { color: var(--success); } .neg { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    .slider { width: 100%; margin: 10px 0; accent-color: var(--accent-indigo); }
    .sim-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <header><h1>Pro Leverage Tracker</h1></header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab-dashboard')">📊 Dashboard</button>
    <button class="tab-btn" onclick="switchTab('tab-log')">📝 Log</button>
    <button class="tab-btn" onclick="switchTab('tab-sim')">🎯 Simulator</button>
    <button class="tab-btn" onclick="switchTab('tab-settings')">⚙️ Settings</button>
  </div>

  <div id="tab-dashboard" class="tab-content active">
    <div class="grid">
      <div class="card">
        <h2>Live Kurse & Bestände</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group"><label>BTC Kurs (€)</label><input type="number" id="dash_btc_price" oninput="runDashboardCalc()"></div>
          <div class="form-group"><label>STRC Kurs (€)</label><input type="number" id="dash_strc_price" step="0.01" oninput="runDashboardCalc()"></div>
          <div class="form-group"><label>BTC Menge</label><input type="number" id="dash_btc_amount" step="0.00001" oninput="runDashboardCalc()"></div>
          <div class="form-group"><label>STRC Menge</label><input type="number" id="dash_strc_amount" step="0.01" oninput="runDashboardCalc()"></div>
        </div>
        <button class="btn" style="background:var(--bg-dark); border:1px solid var(--border); margin-bottom:10px;" onclick="fetchLivePrices()">🔄 Kurse laden</button>
        <button class="btn" onclick="syncFromLog()">📥 Aus Log laden</button>
      </div>
      <div class="card">
        <h2>Vermögen</h2>
        <div style="height: 200px;"><canvas id="donutChart"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px;">
        <div class="kpi-box"><label>Restschuld</label><span class="kval neg" id="dash_kpi_debt">0 €</span></div>
        <div class="kpi-box"><label>Investiertes Portfolio</label><span class="kval pos" id="dash_kpi_assets">0 €</span></div>
        <div class="kpi-box"><label>Noch investieren</label><span class="kval" id="dash_kpi_to_invest" style="color:var(--accent-indigo)">0 €</span></div>
      </div>
      <div class="kpi-box" style="margin-top:15px; background:var(--success-bg); border-color:var(--success);">
        <label style="color:var(--success)">Netto Liquidationswert (Inkl. Cash)</label>
        <span class="kval pos" id="dash_kpi_net" style="font-size:32px;">0 €</span>
      </div>
    </div>
  </div>

  <div id="tab-log" class="tab-content">
    <div class="card">
      <h2>Kauf loggen</h2>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="form-group"><label>Asset</label><select id="log_asset"><option value="BTC">BTC</option><option value="STRC">STRC</option></select></div>
        <div class="form-group"><label>Invest (€)</label><input type="number" id="log_fiat"></div>
        <div class="form-group"><label>Kurs (€)</label><input type="number" id="log_price"></div>
        <div class="form-group"><label>Datum</label><input type="date" id="log_date"></div>
      </div>
      <button class="btn" style="background:var(--success)" onclick="addTransaction()">➕ Speichern</button>
      <table style="margin-top:20px;">
        <thead><tr><th>Datum</th><th>Asset</th><th>Invest</th><th>Menge</th><th></th></tr></thead>
        <tbody id="log_tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-sim" class="tab-content">
    <div class="card">
      <h2>Exit Simulator</h2>
      <div class="form-group">
        <label>Geplantes Exit-Datum</label>
        <input type="date" id="sim_exit_date" oninput="runSim()">
      </div>
      <div class="form-group">
        <label>BTC Zielkurs: <span id="sim_btc_val">150.000</span> €</label>
        <input type="range" min="60000" max="500000" step="5000" value="150000" class="slider" id="sim_btc_slider" oninput="runSim()">
      </div>
      
      <div class="sim-stats">
        <div class="kpi-box"><label>Restschuld (Exit)</label><span class="kval neg" id="sim_debt_at_exit" style="font-size:16px;">0 €</span></div>
        <div class="kpi-box"><label>Zinsen bis dahin</label><span class="kval" id="sim_interest_paid" style="font-size:16px; color:var(--text-muted);">0 €</span></div>
      </div>

      <div class="kpi-box" style="background:var(--bg-dark); margin-top: 15px; border-color: var(--success);">
        <label style="color:var(--success)">Netto-Cash nach Volltilgung (Inkl. Cash-Rest)</label>
        <span class="kval pos" id="sim_result" style="font-size:32px;">0 €</span>
      </div>
    </div>
  </div>

  <div id="tab-settings" class="tab-content">
    <div class="card">
      <h2>Kredit Settings</h2>
      <div class="form-group"><label>Kreditsumme (€)</label><input type="number" id="set_credit_amount"></div>
      <div class="form-group"><label>Zins (%)</label><input type="number" id="set_credit_interest" step="0.01"></div>
      <div class="form-group"><label>Rate (€)</label><input type="number" id="set_credit_rate"></div>
      <div class="form-group"><label>Startdatum</label><input type="date" id="set_credit_start"></div>
      <button class="btn" onclick="saveSettings()">💾 Speichern</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'leverage_tracker_pro_data';
let appState = {
  cred_amt: 50000, cred_int: 5.45, cred_rate: 717.40, cred_start: "2026-05-15",
  dash_btc_p: 65000, dash_strc_p: 92.0, dash_btc_a: 0, dash_strc_a: 0,
  transactions: []
};

let donutChartInst = null;

function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) appState = JSON.parse(saved);
  const old = localStorage.getItem('leverage_app_v2.2');
  if(old && !saved) { appState = JSON.parse(old); saveState(); }
  const d = new Date(); d.setFullYear(d.getFullYear() + 3);
  document.getElementById('sim_exit_date').valueAsDate = d;
  document.getElementById('log_date').valueAsDate = new Date();
  loadFields();
  renderLog();
  runDashboardCalc();
}

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); }

function loadFields() {
  document.getElementById('set_credit_amount').value = appState.cred_amt;
  document.getElementById('set_credit_interest').value = appState.cred_int;
  document.getElementById('set_credit_rate').value = appState.cred_rate;
  document.getElementById('set_credit_start').value = appState.cred_start;
  document.getElementById('dash_btc_price').value = appState.dash_btc_p;
  document.getElementById('dash_strc_price').value = appState.dash_strc_p;
  document.getElementById('dash_btc_amount').value = appState.dash_btc_a;
  document.getElementById('dash_strc_amount').value = appState.dash_strc_a;
}

function saveSettings() {
  appState.cred_amt = parseFloat(document.getElementById('set_credit_amount').value);
  appState.cred_int = parseFloat(document.getElementById('set_credit_interest').value);
  appState.cred_rate = parseFloat(document.getElementById('set_credit_rate').value);
  appState.cred_start = document.getElementById('set_credit_start').value;
  saveState(); runDashboardCalc(); alert("Gespeichert");
}

function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.currentTarget.classList.add('active');
}

function addTransaction() {
  const asset = document.getElementById('log_asset').value;
  const fiat = parseFloat(document.getElementById('log_fiat').value);
  const price = parseFloat(document.getElementById('log_price').value);
  const date = document.getElementById('log_date').value;
  if(fiat && price) {
    appState.transactions.push({ id: Date.now(), asset, date, fiat, price, amount: fiat/price });
    saveState(); renderLog(); runDashboardCalc();
  }
}

function renderLog() {
  const tbody = document.getElementById('log_tbody');
  tbody.innerHTML = '';
  appState.transactions.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
    tbody.innerHTML += `<tr><td>${t.date}</td><td>${t.asset}</td><td>${t.fiat}€</td><td>${t.amount.toFixed(5)}</td><td><button onclick="deleteTx(${t.id})" style="background:none; border:none; color:var(--danger)">✕</button></td></tr>`;
  });
}

function deleteTx(id) {
  appState.transactions = appState.transactions.filter(t => t.id !== id);
  saveState(); renderLog(); runDashboardCalc();
}

function syncFromLog() {
  let btc = 0, strc = 0;
  appState.transactions.forEach(t => { if(t.asset === 'BTC') btc += t.amount; else strc += t.amount; });
  document.getElementById('dash_btc_amount').value = btc.toFixed(6);
  document.getElementById('dash_strc_amount').value = strc.toFixed(2);
  runDashboardCalc();
}

function getMonths(start, end) {
  return Math.max(0, (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth()));
}

function calculateDebtAt(months) {
  let debt = appState.cred_amt;
  let totalInterest = 0;
  for(let i=0; i < months; i++) {
    let monthlyInterest = debt * (appState.cred_int/100/12);
    totalInterest += monthlyInterest;
    debt = debt + monthlyInterest - appState.cred_rate;
  }
  return { debt: Math.max(0, debt), interest: totalInterest };
}

function runDashboardCalc() {
  appState.dash_btc_p = parseFloat(document.getElementById('dash_btc_price').value) || 0;
  appState.dash_strc_p = parseFloat(document.getElementById('dash_strc_price').value) || 0;
  appState.dash_btc_a = parseFloat(document.getElementById('dash_btc_amount').value) || 0;
  appState.dash_strc_a = parseFloat(document.getElementById('dash_strc_amount').value) || 0;
  saveState();

  const monthsPassed = getMonths(new Date(appState.cred_start), new Date());
  const currentStatus = calculateDebtAt(monthsPassed);
  
  const invested = appState.transactions.reduce((s, t) => s + t.fiat, 0);
  const toInvest = Math.max(0, appState.cred_amt - invested);
  const assets = (appState.dash_btc_a * appState.dash_btc_p) + (appState.dash_strc_a * appState.dash_strc_p);

  document.getElementById('dash_kpi_debt').innerText = Math.round(currentStatus.debt).toLocaleString() + " €";
  document.getElementById('dash_kpi_assets').innerText = Math.round(assets).toLocaleString() + " €";
  document.getElementById('dash_kpi_to_invest').innerText = Math.round(toInvest).toLocaleString() + " €";
  document.getElementById('dash_kpi_net').innerText = Math.round(assets + toInvest - currentStatus.debt).toLocaleString() + " €";

  updateChart(appState.dash_btc_a * appState.dash_btc_p, appState.dash_strc_a * appState.dash_strc_p);
  runSim();
}

function updateChart(b, s) {
  const ctx = document.getElementById('donutChart').getContext('2d');
  if(donutChartInst) donutChartInst.destroy();
  donutChartInst = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: ['BTC', 'STRC'], datasets: [{ data: [b, s], backgroundColor: ['#fbbf24', '#6366f1'], borderWidth: 0 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
  });
}

function runSim() {
  const exitDate = new Date(document.getElementById('sim_exit_date').value);
  const btcTarget = document.getElementById('sim_btc_slider').value;
  document.getElementById('sim_btc_val').innerText = parseInt(btcTarget).toLocaleString();

  const monthsToExit = getMonths(new Date(appState.cred_start), exitDate);
  const simStatus = calculateDebtAt(monthsToExit);

  const invested = appState.transactions.reduce((s, t) => s + t.fiat, 0);
  const toInvest = Math.max(0, appState.cred_amt - invested);
  const futureAssets = (appState.dash_btc_a * btcTarget) + (appState.dash_strc_a * appState.dash_strc_p);
  
  document.getElementById('sim_debt_at_exit').innerText = Math.round(simStatus.debt).toLocaleString() + " €";
  document.getElementById('sim_interest_paid').innerText = Math.round(simStatus.interest).toLocaleString() + " €";
  document.getElementById('sim_result').innerText = Math.round(futureAssets + toInvest - simStatus.debt).toLocaleString() + " €";
}

async function fetchLivePrices() {
  try {
    const rB = await fetch('https://api.coinbase.com/v2/prices/BTC-EUR/spot');
    const jB = await rB.json(); document.getElementById('dash_btc_price').value = Math.round(jB.data.amount);
    const rE = await fetch('https://open.er-api.com/v6/latest/USD');
    const jE = await rE.json(); document.getElementById('dash_strc_price').value = (100 * jE.rates.EUR).toFixed(2);
    runDashboardCalc();
  } catch(e) { console.error("Kurs-Fehler"); }
}

window.onload = init;
</script>
</body>
</html>
